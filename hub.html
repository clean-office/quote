<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>모두랩 관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --plane:#f5f5f4;--card:#fff;--ink:#1a1a1c;--ink2:#55555a;--muted:#8e8e93;
  --line:rgba(20,20,22,.1);--line2:rgba(20,20,22,.06);
  --gold:#1c1c1e;--goldL:#3a3a3d;--goldSoft:#e9e9e7;--goldFaint:#f1f1ef;--espresso:#111113;
  --good:#0f9a2f;--goodBg:#e7f3e8;--warn:#c98a12;--warnBg:#f6eed6;--bad:#cf3d3d;--badBg:#fbe9e7;--blue:#2f6ad0;--blueBg:#e8effb;
  --sh:0 1px 2px rgba(36,31,23,.05),0 10px 26px -8px rgba(36,31,23,.10);
  font-family:Pretendard,system-ui,-apple-system,"Malgun Gothic",sans-serif;
}
body{background:var(--plane);color:var(--ink);-webkit-font-smoothing:antialiased;}
svg{display:block;}
.tnum{font-variant-numeric:tabular-nums;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea,select{font-family:inherit;font-size:15px;}

.wrap{display:flex;min-height:100vh;}
/* rail */
.rail{width:82px;background:var(--espresso);flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding:20px 0;gap:5px;position:sticky;top:0;height:100vh;}
.rail .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(150deg,#3a3a3d,#141416);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px;margin-bottom:14px;}
.ri{width:56px;height:50px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#8e8e93;position:relative;}
.ri span{font-size:9.5px;font-weight:600;}
.ri.on{color:#fff;background:rgba(255,255,255,.13);}
.ri.on::before{content:"";position:absolute;left:-13px;width:3px;height:22px;border-radius:3px;background:#fff;}
.ri svg{width:21px;height:21px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.rail .sp{flex:1;}
.rail .av{width:38px;height:38px;border-radius:50%;background:#2c2c2e;color:#e8e8e8;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;border:1.5px solid rgba(255,255,255,.28);}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.top{padding:22px 30px 6px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.htitle{font-size:22px;font-weight:800;letter-spacing:-.02em;}
.htitle small{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-top:4px;}
.top .rt{display:flex;align-items:center;gap:9px;}
.iconbtn{width:42px;height:42px;border-radius:11px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;box-shadow:var(--sh);}
.iconbtn svg{width:18px;height:18px;stroke:var(--ink2);stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.cta{display:flex;align-items:center;gap:7px;background:var(--gold);color:#fff;border-radius:11px;padding:11px 16px;font-size:13.5px;font-weight:700;box-shadow:0 6px 16px -4px rgba(0,0,0,.35);white-space:nowrap;}
.cta svg{width:16px;height:16px;stroke:#fff;stroke-width:2.1;fill:none;stroke-linecap:round;}
.content{padding:18px 30px 40px;}

.banner{background:#fff7e6;border:1px solid #e6d9ad;border-radius:12px;padding:11px 15px;font-size:12.5px;color:#7a5f16;display:flex;align-items:center;gap:9px;margin-bottom:16px;}
.banner b{font-weight:700;} .banner .bx{margin-left:auto;display:flex;gap:8px;}
.banner button{background:var(--gold);color:#fff;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;}
.banner button.gh{background:#fff;border:1px solid #d9d9d7;color:#3a3a3d;}

/* cards / panels */
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 22px;box-shadow:var(--sh);}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.ph .t{font-size:15px;font-weight:800;letter-spacing:-.01em;}
.ph .lnk{font-size:12px;color:var(--gold);font-weight:600;}
.subttl{font-size:12px;color:var(--muted);margin-top:2px;}
.grid{display:grid;gap:16px;}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px;}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;box-shadow:var(--sh);}
.stat .cap{font-size:12px;color:var(--ink2);font-weight:600;display:flex;justify-content:space-between;align-items:center;}
.stat .chipi{width:28px;height:28px;border-radius:8px;background:var(--goldFaint);display:flex;align-items:center;justify-content:center;}
.stat .chipi svg{width:15px;height:15px;stroke:var(--gold);stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.stat .val{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:10px;}
.stat .val small{font-size:13px;font-weight:700;color:var(--muted);}
.stat .foot{font-size:11.5px;color:var(--muted);margin-top:7px;}
.stat.accent{background:linear-gradient(158deg,#161618,#2e2e31);border:none;color:#fff;}
.stat.accent .cap,.stat.accent .foot{color:#a8a8ad;}.stat.accent .val{color:#fff;}.stat.accent .val small{color:#98989d;}
.stat.accent .chipi{background:rgba(255,255,255,.14);}.stat.accent .chipi svg{stroke:#fff;}

.delta{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:7px;}
.d-up{color:var(--good);background:var(--goodBg);}.d-dn{color:var(--bad);background:var(--badBg);}.d-fl{color:var(--warn);background:var(--warnBg);}

/* chart */
.chartwrap{margin-top:18px;position:relative;height:180px;}
.gl{position:absolute;left:46px;right:0;border-top:1px solid var(--line2);}
.yl{position:absolute;left:0;font-size:10px;color:var(--muted);transform:translateY(-50%);}
.bars{position:absolute;left:46px;right:0;bottom:22px;top:6px;display:flex;align-items:flex-end;gap:14px;}
.bcol{flex:1;display:flex;align-items:flex-end;justify-content:center;height:100%;}
.bk{width:32px;max-width:64%;background:linear-gradient(180deg,#e3e3e1,#d4d4d2);border-radius:5px 5px 0 0;position:relative;min-height:2px;}
.bk.on{background:linear-gradient(180deg,#3a3a3d,#141416);}
.bk .dl{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:800;color:var(--gold);white-space:nowrap;}
.xl{position:absolute;bottom:0;left:46px;right:0;display:flex;gap:14px;}
.xl span{flex:1;text-align:center;font-size:10.5px;color:var(--muted);}
.xl span.on{color:var(--ink);font-weight:700;}

/* list rows */
.rowitem{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--line2);}
.rowitem:last-child{border:none;}
.savatar{width:38px;height:38px;border-radius:10px;background:var(--goldFaint);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.savatar svg{width:18px;height:18px;stroke:var(--gold);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.rowitem .info{flex:1;min-width:0;}
.rowitem .nm{font-size:13.5px;font-weight:700;}
.rowitem .mt{font-size:11.5px;color:var(--muted);margin-top:3px;}
.meter{width:100px;flex-shrink:0;}
.meter .bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden;}
.meter .bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#a9862f,#8a6a1c);}
.meter .pct{font-size:10px;color:var(--muted);margin-top:4px;text-align:right;font-weight:600;}
.schip{font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:8px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;}
.sdot{width:6px;height:6px;border-radius:50%;background:currentColor;}
.sc-run{color:var(--blue);background:var(--blueBg);}.sc-pay{color:var(--bad);background:var(--badBg);}.sc-con{color:var(--good);background:var(--goodBg);}
.sc-est{color:var(--warn);background:var(--warnBg);}.sc-done{color:#6e6e73;background:#ececea;}.sc-lead{color:var(--ink2);background:#ececea;}

.pay{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line2);}
.pay:last-child{border:none;}
.pay .pi{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.pay .pn{font-size:13px;font-weight:600;flex:1;}
.pay .pv{font-size:13px;font-weight:800;text-align:right;}
.pay .ps{font-size:11px;color:var(--muted);font-weight:600;text-align:right;}

.tl{margin-top:14px;}
.tlr{display:flex;gap:12px;padding-bottom:15px;position:relative;}
.tlr:last-child{padding-bottom:0;}
.tlr::before{content:"";position:absolute;left:5px;top:14px;bottom:-2px;width:1.5px;background:var(--line);}
.tlr:last-child::before{display:none;}
.tld{width:11px;height:11px;border-radius:50%;flex-shrink:0;margin-top:2px;border:2.5px solid var(--card);box-shadow:0 0 0 1.5px currentColor;}
.tlc .tt{font-size:13px;font-weight:600;color:var(--ink);}
.tlc .tm{font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:6px;}
.badge{font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:26px 0;}

/* kanban */
.kb{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.kcol{background:#ececea;border-radius:14px;padding:12px;min-height:120px;}
.kh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;font-weight:800;}
.kh .sum{font-size:10.5px;color:var(--muted);font-weight:600;}
.kcnt{background:var(--gold);color:#fff;border-radius:10px;font-size:10.5px;padding:1px 8px;margin-left:6px;}
.kc{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:9px;padding:11px 12px;margin-bottom:9px;box-shadow:0 1px 2px rgba(36,31,23,.04);}
.kc .t{font-size:13px;font-weight:700;}
.kc .a{font-size:12px;font-weight:800;color:var(--gold);margin-top:4px;}
.kc .m{font-size:10.5px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;align-items:center;}
.kc .mv{display:flex;gap:5px;margin-top:9px;}
.kc .mv button{flex:1;border:1px solid var(--line);border-radius:7px;padding:5px;font-size:11px;color:var(--ink2);font-weight:600;background:var(--plane);}
.kaddc{width:100%;border:1.5px dashed var(--goldL);color:var(--gold);border-radius:9px;padding:9px;font-size:12px;font-weight:700;background:none;}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{text-align:left;font-size:11px;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:2px solid var(--line);}
.tbl td{padding:12px;border-bottom:1px solid var(--line2);}
.tbl .num{text-align:right;} .tbl .nm{font-weight:700;}
.tick{display:inline-flex;width:22px;height:22px;border-radius:6px;align-items:center;justify-content:center;font-size:12px;cursor:pointer;border:1.5px solid var(--line);}
.tick.on{background:var(--good);border-color:var(--good);color:#fff;}

/* dict */
.dict{display:grid;grid-template-columns:190px 1fr;gap:16px;}
.cats{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;height:fit-content;box-shadow:var(--sh);}
.cat{padding:10px 12px;border-radius:9px;font-size:13.5px;margin-bottom:2px;display:flex;justify-content:space-between;cursor:pointer;}
.cat.on{background:var(--gold);color:#fff;font-weight:700;}.cat .n{font-size:11px;opacity:.7;}
.ditem{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;display:flex;align-items:center;gap:14px;margin-bottom:9px;box-shadow:var(--sh);}
.ditem .nm{font-size:14px;font-weight:700;}.ditem .sp{font-size:11.5px;color:var(--muted);margin-top:2px;}
.ditem .pr{text-align:right;font-size:11.5px;color:var(--muted);white-space:nowrap;}.ditem .pr b{color:var(--ink);}
.addb{background:var(--goldSoft);color:var(--gold);border-radius:8px;padding:8px 13px;font-size:12px;font-weight:700;white-space:nowrap;}

/* generic */
.btn{background:var(--gold);color:#fff;border-radius:10px;padding:10px 15px;font-size:13px;font-weight:700;}
.btn.gh{background:var(--card);border:1px solid var(--line);color:var(--ink);}
.btn.sm{padding:7px 12px;font-size:12px;border-radius:8px;}
.rowflex{display:flex;gap:10px;align-items:center;}

/* modal */
.ov{position:fixed;inset:0;background:rgba(36,31,23,.42);display:none;align-items:flex-end;justify-content:center;z-index:100;}
.ov.on{display:flex;}
.modal{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;padding:22px 22px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease;}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.modal h3{font-size:17px;font-weight:800;margin-bottom:16px;}
.f{margin-bottom:13px;}
.f label{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-bottom:5px;}
.f input,.f textarea,.f select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;color:var(--ink);font-size:14.5px;}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.mact{display:flex;gap:10px;margin-top:18px;}
.mact .btn{flex:1;text-align:center;padding:13px;}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--espresso);color:#f2f2f2;padding:11px 20px;border-radius:22px;font-size:13.5px;z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.3);}
.toast.on{opacity:1;}

/* calendar */
.calhead{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.calhead .cm{font-size:18px;font-weight:800;min-width:110px;text-align:center;}
.calhead button.nav{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-size:15px;font-weight:700;}
.vtog{display:flex;background:var(--card);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-left:auto;}
.vtog button{padding:8px 14px;font-size:13px;font-weight:700;color:var(--muted);}
.vtog button.on{background:var(--espresso);color:#fff;}
.calwk{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px;}
.calwk span{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding:6px 0;}
.calwk span:first-child{color:var(--bad);}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.cald{background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:88px;padding:7px 7px 5px;cursor:pointer;overflow:hidden;}
.cald .dn{font-size:12.5px;font-weight:700;color:var(--ink2);}
.cald.sun .dn{color:var(--bad);}
.cald.other{opacity:.38;}
.cald.today{border:1.5px solid var(--ink);}
.cald.today .dn{background:var(--espresso);color:#fff;border-radius:6px;padding:1px 6px;display:inline-block;}
.cald.sel{background:var(--goldFaint);border-color:var(--ink2);}
.calev{font-size:11px;font-weight:600;background:#ececea;border-radius:5px;padding:2px 5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.calev.past{opacity:.5;}
.calmore{font-size:10.5px;color:var(--muted);margin-top:2px;font-weight:700;}
@media(max-width:860px){
 .cald{min-height:56px;padding:5px 4px;border-radius:8px;}
 .calev{display:none;}
 .cald .dots{display:flex;gap:2px;margin-top:4px;flex-wrap:wrap;}
 .cald .dots i{width:5px;height:5px;border-radius:50%;background:var(--ink);display:block;}
}
@media(min-width:861px){.cald .dots{display:none;}}

/* schedule modal chips */
.mrow{display:flex;gap:6px;flex-wrap:wrap;}
.mchip{border:1.5px solid var(--line);border-radius:16px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--ink2);background:var(--card);}
.mchip.on{background:var(--espresso);color:#fff;border-color:var(--espresso);}

/* mobile bottom tab */
.mtab{display:none;}
@media(max-width:860px){
  .rail{display:none;}
  .top{padding:16px 16px 4px;}
  .htitle{font-size:19px;}
  .content{padding:14px 16px 90px;}
  .stats{grid-template-columns:1fr 1fr;}
  .grid.two{grid-template-columns:1fr!important;}
  .kb{grid-template-columns:1fr;gap:12px;}
  .dict{grid-template-columns:1fr;}
  .cats{display:flex;overflow-x:auto;gap:6px;}
  .cat{white-space:nowrap;}
  .desktopHide{display:none;}
  .mtab{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--espresso);z-index:90;padding:8px 4px calc(8px + env(safe-area-inset-bottom));justify-content:space-around;}
  .mtab a{display:flex;flex-direction:column;align-items:center;gap:3px;color:#8e8e93;font-size:10px;font-weight:600;text-decoration:none;}
  .mtab a.on{color:#fff;}
  .mtab svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .modal{max-width:100%;}
  .tblwrap{overflow-x:auto;} .tbl{min-width:560px;}
}
@media(min-width:861px){ .grid.two{grid-template-columns:2fr 1fr;} }

/* ---------- v2 가독성 ---------- */
:root{--ink2:#48484a;--muted:#828287;}
.htitle{font-size:24px;}
.stat .cap{font-size:13.5px;} .stat .val{font-size:33px;} .stat .val small{font-size:14px;} .stat .foot{font-size:13px;}
.ph .t{font-size:16.5px;} .ph .lnk{font-size:13.5px;} .subttl{font-size:13px;}
.banner{font-size:13.5px;}
.rowitem{padding:14px 0;} .rowitem .nm{font-size:15px;} .rowitem .mt{font-size:12.5px;margin-top:4px;}
.pay .pn{font-size:14.5px;} .pay .pv{font-size:15px;} .pay .ps{font-size:12px;}
.tlc .tt{font-size:14.5px;} .tlc .tm{font-size:12.5px;} .badge{font-size:11.5px;}
.empty{font-size:14px;}
.kb{grid-template-columns:repeat(5,1fr);}
.kh{font-size:14px;} .kh .sum{font-size:12px;}
.kc .t{font-size:14.5px;} .kc .a{font-size:14.5px;margin-top:5px;} .kc .m{font-size:12px;}
.kc .mv button{font-size:12.5px;padding:7px;}
.schip{font-size:11.5px;}
.tbl{font-size:14px;} .tbl th{font-size:12px;}
.btn{font-size:14px;} .btn.sm{font-size:13px;}
@media(max-width:860px){
 .stat .val{font-size:28px;}
 .kb{display:flex;overflow-x:auto;padding-bottom:8px;grid-template-columns:none;}
 .kcol{min-width:255px;flex-shrink:0;}
 .rowitem .nm{font-size:15.5px;}
}
</style></head>
<body>
<div class="wrap">
  <nav class="rail" id="rail"></nav>
  <div class="main">
    <div class="top">
      <div class="htitle" id="pageTitle">홈</div>
      <div class="rt">
        <div class="iconbtn" onclick="doBackup()" title="백업 내보내기"><svg viewBox="0 0 24 24"><path d="M12 3v12M8 11l4 4 4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg></div>
        <button class="cta" onclick="location.href='./index.html'"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>새 견적</button>
      </div>
    </div>
    <div class="content" id="view"></div>
  </div>
</div>
<nav class="mtab" id="mtab"></nav>
<div class="ov" id="ov" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- icons ---------- */
const IC={
 home:'<path d="M4 13h6v7H4zM14 4h6v16h-6zM4 4h6v5H4z"/>',
 sales:'<path d="M4 20V10M10 20V4M16 20v-6M22 20H2"/>',
 site:'<path d="M3 21h18M5 21V7l8-4v18M19 21V11l-6-3"/>',
 quote:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>',
 settle:'<path d="M20 7H5a2 2 0 0 0 0 9h15v-9zM20 7V5a2 2 0 0 0-2-2H6"/>',

const KEY='mdl_hub_v1';

function seed(){return {seeded:true,_fresh:true,_ts:0,sites:[],sales:[],customers:[],dict:[],tasks:[],schedule:[],pipe:{},_del:{}};}
/* 구버전이 만들어 둔 예시 데이터 서명 — 어느 기기에서 올라와도 자동 제거 */
const SAMPLE_SIG={
 sites:['역삼 사무실 리모델링|38500000','봉천 치킨배달전문점|1020000','역삼 사무실 (1차)|40000000','강남 헤어샵|56000000'],
 sales:['봉천 치킨배달전문점|9500000','신림 미용실|18000000','서초 무인카페|23400000','방배 학원|41000000','논현 오피스|28000000'],
 customers:['이정훈 대표|010-2345-6789','이성원 실장|'],
 dict:['철거|데크 철거','철거|벽체 철거','철거|폐기물 처리','목공|석고보드 벽','전기|매입등 설치'],
 schedule:['2026-07-19|봉천 치킨집 실측 방문','2026-07-22|신림 미용실 미팅','2026-07-24|봉천 치킨집 착공']
};
function sampleSig(k,o){
 if(k==='sites'||k==='sales')return (o.name||'')+'|'+(o.amount||0);
 if(k==='customers')return (o.name||'')+'|'+(o.phone||'');
 if(k==='dict')return (o.cat||'')+'|'+(o.name||'');
 if(k==='schedule')return (o.date||'')+'|'+(o.title||'');
 return '';}
function purgeSamples(){let n=0;
 Object.keys(SAMPLE_SIG).forEach(k=>{const sig=SAMPLE_SIG[k],keep=[];
  (DB[k]||[]).forEach(o=>{if(o&&sig.includes(sampleSig(k,o))){DB._del=DB._del||{};if(o.id)DB._del[o.id]=Date.now();n++;}else keep.push(o);});
  DB[k]=keep;});
 return n;}
const COLLS=['sites','sales','customers','dict','tasks','schedule'];
function normalizeDB(){COLLS.forEach(k=>{if(!Array.isArray(DB[k]))DB[k]=[];});
 if(!DB.pipe||typeof DB.pipe!=='object'||Array.isArray(DB.pipe))DB.pipe={};
 if(!DB._del||typeof DB._del!=='object'||Array.isArray(DB._del))DB._del={};
 return purgeSamples();}
function load(){try{DB=JSON.parse(localStorage.getItem(KEY));}catch(e){DB=null;}
 if(!DB||!DB.seeded){DB=seed();localStorage.setItem(KEY,JSON.stringify(DB));}
 if(normalizeDB()){delete DB._fresh;DB._ts=Date.now();localStorage.setItem(KEY,JSON.stringify(DB));cloudPush();}}
function save(){DB._ts=Date.now();delete DB._fresh;normalizeDB();localStorage.setItem(KEY,JSON.stringify(DB));localStorage.setItem(KEY+'_bak',JSON.stringify({t:DB._ts,data:DB}));cloudPush();}
function tomb(id){DB._del=DB._del||{};DB._del[id]=Date.now();}
function mergeDB(remote){
 const rt=remote._ts||0,lt=DB._ts||0,localNewer=lt>=rt;
 const del={...(remote._del||{}),...(DB._del||{})};
 const out=localNewer?{...remote,...DB}:{...DB,...remote};
 COLLS.forEach(k=>{
  const a=Array.isArray(DB[k])?DB[k]:[],b=Array.isArray(remote[k])?remote[k]:[];
  const m={};(localNewer?b:a).forEach(z=>{if(z&&z.id)m[z.id]=z;});(localNewer?a:b).forEach(z=>{if(z&&z.id)m[z.id]=z;});
  Object.keys(del).forEach(id=>{delete m[id];});
  out[k]=Object.values(m);
 });
 out.pipe=localNewer?{...(remote.pipe||{}),...(DB.pipe||{})}:{...(DB.pipe||{}),...(remote.pipe||{})};
 out._del=del;out._ts=Math.max(lt,rt);out.seeded=true;delete out._fresh;return out;}

/* ---------- cloud sync (Supabase, single-row JSON) ---------- */
const CLOUD_KEY='mdl_cloud';
let cloud=null, cloudStatus='off', cloudTimer=null;
function loadCloud(){try{cloud=JSON.parse(localStorage.getItem(CLOUD_KEY));}catch(e){cloud=null;} if(cloud&&cloud.url&&cloud.key)cloudStatus='ok'; else {cloud=null;cloudStatus='off';}}
function sbHeaders(){return {apikey:cloud.key,Authorization:'Bearer '+cloud.key,'Content-Type':'application/json'};}
async function cloudFetch(){
 const r=await fetch(`${cloud.url}/rest/v1/moredo_state?id=eq.main&select=data,updated_at`,{headers:sbHeaders()});
 if(r.status===404||r.status===400)throw new Error('table');
 if(!r.ok)throw new Error('HTTP '+r.status);
 const rows=await r.json();return rows[0]||null;
}
async function cloudUpsert(){
 const body=[{id:'main',data:DB,updated_at:new Date(DB._ts||Date.now()).toISOString()}];
 const r=await fetch(`${cloud.url}/rest/v1/moredo_state`,{method:'POST',headers:{...sbHeaders(),Prefer:'resolution=merge-duplicates'},body:JSON.stringify(body)});
 if(!r.ok)throw new Error('HTTP '+r.status);
}
function cloudPush(){
 if(!cloud)return;clearTimeout(cloudTimer);
 cloudTimer=setTimeout(async()=>{
  cloudStatus='sync';paintCloud();
  for(let i=0;i<3;i++){
   try{await cloudUpsert();cloudStatus='ok';paintCloud();return;}
   catch(e){await new Promise(r=>setTimeout(r,900*(i+1)));}
  }
  cloudStatus='error';paintCloud();
 },600);
}
async function cloudPullMerge(){
 if(!cloud)return;
 try{const row=await cloudFetch();
  if(row&&row.data){
   const remote=row.data,before=JSON.stringify(DB);
   DB=(DB&&DB._fresh)?remote:mergeDB(remote);
   normalizeDB();
   if(JSON.stringify(DB)!==before){localStorage.setItem(KEY,JSON.stringify(DB));await cloudUpsert();render();}
  } else if(!(DB&&DB._fresh)){await cloudUpsert();}
  cloudStatus='ok';
 }catch(e){cloudStatus=e.message==='table'?'notable':'error';}
 paintCloud();
}
function paintCloud(){const b=document.getElementById('cloudDot');if(b)b.textContent={off:'',ok:'☁️ 저장됨',sync:'☁️ 저장 중…',error:'⚠️ 동기화 오류',notable:'⚠️ 테이블 없음'}[cloudStatus]||'';const bn=document.querySelector('.banner');if(bn&&route()==='home')render();}
async function cloudConnect(){
 const url=($('sb_url').value||'').trim().replace(/\/$/,'');const key=($('sb_key').value||'').trim();
 if(!/^https:\/\/.+\.supabase\.co$/.test(url)){toast('URL 형식을 확인하세요 (https://xxxx.supabase.co)');return;}
 if(key.length<30){toast('anon key를 확인하세요');return;}
 cloud={url,key};toast('연결 확인 중…');
 try{await cloudFetch();localStorage.setItem(CLOUD_KEY,JSON.stringify(cloud));cloudStatus='ok';await cloudPullMerge();toast('클라우드 연결 완료 — 이제 영구 저장돼요');render();}
 catch(e){if(e.message==='table'){localStorage.setItem(CLOUD_KEY,JSON.stringify(cloud));toast('연결됨 — 아직 테이블이 없어요. 설정의 SQL을 실행해주세요');cloudStatus='notable';render();}
  else{cloud=null;cloudStatus='off';toast('연결 실패 — URL·키를 확인하세요');}}
}
function cloudDisconnect(){localStorage.removeItem(CLOUD_KEY);cloud=null;cloudStatus='off';toast('클라우드 연결 해제');render();}
function copySQL(){const sql="create table if not exists moredo_state (id text primary key, data jsonb, updated_at timestamptz default now());\nalter table moredo_state enable row level security;\ncreate policy \"anon all\" on moredo_state for all using (true) with check (true);";navigator.clipboard&&navigator.clipboard.writeText(sql);toast('SQL 복사됨 — Supabase SQL Editor에 붙여넣고 Run');}

let EST={};

async function estPull(){

 try{
  const r=await fetch(`${cloud.url}/rest/v1/moredo_state?id=eq.estimates&select=data`,{headers:sbHeaders()});
  if(!r.ok)return;const rows=await r.json();
  const remote=(rows[0]&&rows[0].data&&rows[0].data.saves)||{};
  const local=JSON.parse(localStorage.getItem('mdl_saves')||'{}');
  const merged={...local};
  Object.keys(remote).forEach(k=>{if(!merged[k]||((remote[k].t||0)>(merged[k].t||0)))merged[k]=remote[k];});
  localStorage.setItem('mdl_saves',JSON.stringify(merged));EST=merged;render();
 }catch(e){}
}
const numv=v=>{const n=parseFloat(String(v??'').replace(/[^\d.\-]/g,''));return isNaN(n)?0:n;};
function estTotal(st){
 if(!st||!Array.isArray(st.sections))return 0;
 let d=0;st.sections.forEach(s=>(s.items||[]).forEach(it=>{const q=numv(it.qty);d+=q*numv(it.mat)+q*numv(it.lab);}));
 const ind=Math.round(d*(numv(st.r1)||0)/100)+Math.round(d*(numv(st.r2)||0)/100)+Math.round(d*(numv(st.r3)||0)/100);
 const raw=d+ind;const tgt=numv(st.target);
 const cut=(st.target!==''&&st.target!=null&&tgt>0)?raw-tgt:raw%10000;
 return raw-cut;
}
function estList(){loadEst();return Object.keys(EST).map(k=>({k,t:EST[k].t||0,st:EST[k].data||{},total:estTotal(EST[k].data)})).sort((a,b)=>b.t-a.t);}

 const now=new Date();const ym=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
 let cnt=0,sum=0;
 estList().forEach(e=>{const d=(e.st&&e.st.date)||new Date(e.t).toISOString().slice(0,10);if(String(d).slice(0,7)===ym){cnt++;sum+=e.total;}});
 return {cnt,sum};
}

function schedTitle(s){return s.title||((s.site&&s.proc)?s.site+' — '+s.proc:(s.site||s.proc||'일정'));}
function projBase(n){return (n||'').replace(/\s*v\d+\s*$/i,'').replace(/\s*\(\d{4}-\d{2}-\d{2}\)\s*$/,'').replace(/\s*\(\uBC31\uC5C5\)\s*$/,'').trim()||n;}
function siteNames(){const arr=[];DB.sites.forEach(s=>{if(s.name&&!arr.includes(s.name))arr.push(s.name);});try{estList().forEach(e=>{const b=projBase(e.k);if(b&&!arr.includes(b))arr.push(b);});}catch(e){}return arr;}
function addrLink(a){return a?` · <a href="https://map.kakao.com/link/search/${encodeURIComponent(a)}" target="_blank" onclick="event.stopPropagation()" style="color:var(--blue);text-decoration:underline">📍${esc(a)}</a>`:'';}
function phoneLink(p){return p?` · <a href="tel:${esc(String(p).replace(/[^\d+]/g,''))}" onclick="event.stopPropagation()" style="color:var(--good);text-decoration:underline;font-weight:700">📞${esc(p)}</a>`:'';}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dayLabel(dt){const t=todayStr();if(dt===t)return['오늘','var(--bad)'];const d=new Date(t),n=new Date(dt);const diff=Math.round((n-d)/86400000);if(diff===1)return['내일','var(--warn)'];if(diff<0)return['지남','var(--muted)'];if(diff<=7)return['D-'+diff,'var(--blue)'];return[(n.getMonth()+1)+'/'+n.getDate(),'var(--blue)'];}
function todayList(){
 const t=todayStr();
 const items=[...DB.schedule].filter(s=>(s.end||s.date)>=t).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,4);
 if(!items.length)return '<div class="empty">등록된 일정이 없어요 — ＋로 추가</div>';
 return '<div class="tl">'+items.map(s=>{const[lb,cl]=dayLabel(s.date);return `<div class="tlr" style="color:${cl}"><span class="tld"></span><div class="tlc"><div class="tt">${esc(schedTitle(s))}</div><div class="tm"><span class="badge" style="color:inherit;background:var(--goldFaint)">${lb}${s.time?' '+esc(s.time):''}</span>${s.with?esc(s.with):''}${addrLink(s.addr)}${phoneLink(s.phone)}</div></div></div>`;}).join('')+'</div>';
}
function calc(){
 let contracted=0,contractCnt=0,receivable=0,overdue=0,constructing=0,settling=0;
 DB.sites.forEach(s=>{
  if(ACTIVE.includes(s.status)||s.status==='done'){contracted+=s.amount||0;}
  if(ACTIVE.includes(s.status))contractCnt++;
  const u=unpaid(s);receivable+=u;
  if(s.status==='settle'&&u>0)overdue++;
  if(s.status==='construction')constructing++;
  if(s.status==='settle')settling++;
 });
 const quoteCnt=DB.sales.filter(s=>s.stage==='sent'||s.stage==='contract').length;
 return {contracted,contractCnt,receivable,overdue,constructing,settling,quoteCnt};
}
function monthChart(){
 const now=new Date();
 const months=[];for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push({key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,label:(d.getMonth()+1)+'월'});}
 const sums={};DB.sites.forEach(s=>{if((ACTIVE.includes(s.status)||s.status==='done')&&s.cmonth)sums[s.cmonth]=(sums[s.cmonth]||0)+(s.amount||0);});
 const max=Math.max(1,...months.map(m=>sums[m.key]||0));
 const bars=months.map((m,i)=>({label:m.label,v:sums[m.key]||0,h:Math.round((sums[m.key]||0)/max*100),on:i===months.length-1}));
 return {bars,max};
}

/* ---------- SALES (pipeline) ---------- */
const STAGES=[['sent','견적 발송'],['nego','협의중'],['contract','계약'],['run','시공중'],['done','완료']];
const OLDMAP={lead:'sent',visit:'sent',sent:'sent',contract:'contract',nego:'nego',run:'run',done:'done'};
function pipeCards(){
 const est=estList().map(e=>({id:'est:'+e.k,name:e.k,amount:e.total,stage:pipeStage(e.k),sub:(e.st.date||new Date(e.t).toLocaleDateString('ko-KR')),est:true}));
 const man_=DB.sales.map(s=>({id:s.id,name:s.name,amount:s.amount||0,stage:OLDMAP[s.stage]||'sent',sub:s.client||s.due||'',est:false}));
 return est.concat(man_);
}
function viewSales(){
 const cards=pipeCards();
 const open=cards.filter(c=>c.stage==='sent'||c.stage==='nego');
 return `<div class="rowflex" style="justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px">
   <div class="subttl" style="font-size:14px">답 기다리는 견적 <b style="color:var(--gold)">${open.length}건 · ${man(open.reduce((a,c)=>a+c.amount,0))}원</b> — 견적기에서 저장한 건은 자동으로 올라와요</div>
   <button class="btn sm" onclick="addSale('sent')">＋ 직접 추가</button></div>
 <div class="kb">${STAGES.map(([k,label])=>{
  const cs=cards.filter(c=>c.stage===k);
  return `<div class="kcol"><div class="kh"><span>${label}<span class="kcnt">${cs.length}</span></span><span class="sum">${man(cs.reduce((a,c)=>a+c.amount,0))}</span></div>
   ${cs.map(pipeCard).join('')}
  </div>`;
 }).join('')}</div>`;
}
function pipeCard(c){const idx=STAGES.findIndex(x=>x[0]===c.stage);
 return `<div class="kc"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:6px"><div class="t">${esc(c.name)}</div>${c.est?'':`<button onclick="delSale('${c.id}')" style="color:var(--muted);font-size:17px;line-height:1;flex-shrink:0">×</button>`}</div>
  <div class="a tnum">${won(c.amount)}원</div>
  <div class="m"><span>${esc(c.sub)}</span><span>${c.est?'견적 연동':''}</span></div>
  <div class="mv">
   <button ${idx<=0?'disabled style=opacity:.35':''} onclick="pipeMove('${c.id.replace(/'/g,"\\'")}',-1)">←</button>
   ${c.est?'':`<button onclick="editSale('${c.id}')">수정</button>`}
   <button ${idx>=STAGES.length-1?'disabled style=opacity:.35':''} onclick="pipeMove('${c.id.replace(/'/g,"\\'")}',1)">${idx===1?'계약 →':'→'}</button>
  </div></div>`;}
function pipeMove(id,d){
 if(id.startsWith('est:')){
  const k=id.slice(4);const cur=pipeStage(k);const i=STAGES.findIndex(x=>x[0]===cur)+d;
  if(i<0||i>=STAGES.length)return;DB.pipe[k]=STAGES[i][0];
  if(STAGES[i][0]==='contract')offerSite(k,estTotal(EST[k]&&EST[k].data));
  save();render();return;
 }
 const s=DB.sales.find(x=>x.id===id);if(!s)return;
 const cur=OLDMAP[s.stage]||'sent';const i=STAGES.findIndex(x=>x[0]===cur)+d;
 if(i<0||i>=STAGES.length)return;s.stage=STAGES[i][0];
 if(s.stage==='contract')offerSite(s.name,s.amount);
 save();render();
}
function offerSite(name,amount){
 if(DB.sites.some(x=>x.name===name))return;
 if(confirm(name+' — 계약! 진행 현장으로 등록할까요?')){
  const now=new Date();
  DB.sites.unshift({id:uid(),name:name,client:'',phone:'',addr:'',amount:amount||0,status:'contract',progress:5,end:'',pay:{d:false,m:false,f:false},cmonth:now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')});
  toast('현장으로 등록됨 — 현장 탭에서 확인');
 }
}

 return `<div class="panel" style="margin-bottom:16px"><div class="ph"><div class="t">데이터 저장</div></div>
   <p class="subttl" style="line-height:1.6;margin:6px 0 14px">지금은 <b>이 브라우저에만</b> 저장돼요(임시). 아래 클라우드(Supabase)를 연결하면 폰·PC 어디서나 남고 절대 안 날아갑니다.</p>
   <div class="rowflex" style="gap:10px;flex-wrap:wrap"><button class="btn gh" onclick="doBackup()">백업 파일 내보내기</button><label class="btn gh" style="cursor:pointer">백업 불러오기<input type="file" accept="application/json" style="display:none" onchange="doRestore(this)"></label></div>
  </div>
  <div class="panel"><div class="ph"><div class="t">☁️ 클라우드 연결 (Supabase)</div>${cloud?'<button class="btn gh sm" onclick="cloudDisconnect()">연결 해제</button>':''}</div>
   <p class="subttl" style="line-height:1.6;margin:6px 0 14px">${cloud?(cloudStatus==='notable'?'연결됨. 아래 SQL을 Supabase에서 한 번 실행하면 완료돼요.':'✅ 연결됨 — 데이터가 클라우드에 영구 저장됩니다.'):'Supabase 프로젝트 URL과 anon 키를 넣으면 폰·PC 어디서나 남고 안 날아가요. (anon 키는 앱에 넣어도 되는 공개용 키입니다.)'}</p>
   <div class="f"><label>Project URL</label><input id="sb_url" placeholder="https://xxxx.supabase.co" value="${esc(cloud?.url||'')}"></div>
   <div class="f"><label>anon public key</label><input id="sb_key" placeholder="eyJ..." value="${esc(cloud?.key||'')}"></div>
   <button class="btn" onclick="cloudConnect()">${cloud?'다시 연결':'연결'}</button>
   <div style="margin-top:16px;border-top:1px solid var(--line2);padding-top:14px">
    <div class="rowflex" style="justify-content:space-between;margin-bottom:8px"><b style="font-size:13px">1회 설정: 테이블 만들기</b><button class="btn gh sm" onclick="copySQL()">SQL 복사</button></div>
    <p class="subttl" style="line-height:1.6">Supabase 대시보드 → SQL Editor에 아래를 붙여넣고 <b>Run</b> 한 번만 하면 끝이에요.</p>
    <pre style="background:#faf7ee;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:11px;overflow-x:auto;margin-top:8px;line-height:1.5;color:#4a4436">create table if not exists moredo_state (
  id text primary key, data jsonb, updated_at timestamptz default now());
alter table moredo_state enable row level security;
create policy "anon all" on moredo_state for all using (true) with check (true);</pre>
   </div>
  </div>
  <div class="panel" style="margin-top:16px"><div class="ph"><div class="t">예시 데이터</div></div>
   <p class="subttl" style="margin:6px 0 12px">지금은 시연용 예시 데이터가 들어있어요. 실제 사용 시작할 때 한 번 비우세요.</p>
   <button class="btn gh" onclick="if(confirm('현장·영업·고객·단가·일정을 모두 지울까요? (되돌릴 수 없음)')){COLLS.forEach(k=>{(DB[k]||[]).forEach(o=>{if(o&&o.id)tomb(o.id);});DB[k]=[];});DB.pipe={};save();render();toast('비웠어요 — 새로 등록해보세요')}">데이터 전체 비우기</button>
  </div>`;
}
function doBackup(){const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='모두랩_백업_'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('백업 파일 저장됨');}
function doRestore(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d.sites)throw 0;DB=d;save();render();toast('백업 불러오기 완료');}catch(e){toast('올바른 백업 파일이 아니에요');}};rd.readAsText(f);}

/* ---------- generic sales/task modals ---------- */
function addSale(stage){openModal(`<h3>영업 등록</h3>
 <div class="f"><label>현장/건 이름</label><input id="s_name"></div>
 <div class="f2"><div class="f"><label>예상 금액(원)</label><input id="s_amount" inputmode="numeric" placeholder="0"></div><div class="f"><label>단계</label><select id="s_stage">${STAGES.map(([k,v])=>`<option value="${k}" ${stage===k?'selected':''}>${v}</option>`).join('')}</select></div></div>
 <div class="f2"><div class="f"><label>고객</label><input id="s_client"></div><div class="f"><label>다음 일정/메모</label><input id="s_due" placeholder="예: 7/22 실측"></div></div>
 <div class="mact"><button class="btn gh" onclick="closeModal()">취소</button><button class="btn" onclick="createSale()">등록</button></div>`);}
function createSale(){const n=$('s_name').value.trim();if(!n){toast('이름을 입력하세요');return;}DB.sales.unshift({id:uid(),name:n,amount:parseInt($('s_amount').value.replace(/\D/g,''))||0,stage:$('s_stage').value,client:$('s_client').value,due:$('s_due').value});save();closeModal();render();toast('영업 등록됨');}
function editSale(id){const s=DB.sales.find(x=>x.id===id);if(!s)return;openModal(`<h3>영업 수정</h3>
 <div class="f"><label>이름</label><input id="s_name" value="${esc(s.name)}"></div>
 <div class="f2"><div class="f"><label>예상 금액(원)</label><input id="s_amount" inputmode="numeric" value="${s.amount||0}"></div><div class="f"><label>다음 일정/메모</label><input id="s_due" value="${esc(s.due||'')}"></div></div>
 <div class="mact"><button class="btn gh" onclick="delSale('${s.id}')">삭제</button><button class="btn" onclick="updateSale('${s.id}')">저장</button></div>`);}
function updateSale(id){const s=DB.sales.find(x=>x.id===id);if(!s)return;s.name=$('s_name').value;s.amount=parseInt($('s_amount').value.replace(/\D/g,''))||0;s.due=$('s_due').value;save();closeModal();render();toast('저장됨');}
function delSale(id){if(!confirm('이 영업 건을 삭제할까요?'))return;DB.sales=DB.sales.filter(x=>x.id!==id);tomb(id);save();closeModal();render();toast('삭제됨');}

/* ---------- SCHEDULE (미팅·일정) ---------- */
let calYM=null;
let schedMode=localStorage.getItem('mdl_sched_view')||'cal';
let calSel=null;
function setSchedMode(m){schedMode=m;localStorage.setItem('mdl_sched_view',m);render();}
function calMove(d){const [y,m]=calYM.split('-').map(Number);const nd=new Date(y,m-1+d,1);calYM=nd.getFullYear()+'-'+String(nd.getMonth()+1).padStart(2,'0');calSel=null;render();}
function calPick(dt){calSel=dt;render();}
function schedRow(s){const t0=todayStr();const ongoing=s.date<t0&&(s.end||s.date)>=t0;const[lb,cl]=ongoing?['진행중','var(--good)']:dayLabel(s.date);
 return `<div class="rowitem" style="border-left:3px solid ${colorFor(s.site)};padding-left:11px"><div class="savatar" style="background:var(--goldFaint)"><svg viewBox="0 0 24 24">${IC.cal}</svg></div><div class="info"><div class="nm">${esc(schedTitle(s))}</div><div class="mt">${esc(s.date)}${s.end?' ~ '+esc(s.end):''}${s.time?' '+esc(s.time):''}${s.with?' · '+esc(s.with):''}${s.memo?' · '+esc(s.memo):''}${addrLink(s.addr)}${phoneLink(s.phone)}</div></div><span class="schip" style="color:${cl};background:var(--goldFaint)"><span class="sdot"></span>${lb}${s.time?' '+esc(s.time):''}</span><button onclick="delMeeting('${s.id}')" style="color:var(--muted);font-size:16px;flex-shrink:0">×</button></div>`;}
function viewSchedule(){
 const t=todayStr();
 if(schedMode==='list'){
  const list=[...DB.schedule].sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
  const upcoming=list.filter(s=>(s.end||s.date)>=t), past=list.filter(s=>(s.end||s.date)<t).reverse();
  return `<div class="rowflex" style="justify-content:space-between;margin-bottom:14px"><div class="subttl">다가오는 일정 ${upcoming.length}건</div>
   <div class="rowflex"><div class="vtog"><button class="on" onclick="setSchedMode('list')">목록</button><button onclick="setSchedMode('cal')">달력</button></div><button class="btn sm" onclick="addMeeting()">＋ 일정 등록</button></div></div>
   <div class="panel">${upcoming.length?upcoming.map(schedRow).join(''):'<div class="empty">다가오는 일정이 없어요 — ＋로 미팅·실측·시공 일정을 올려보세요</div>'}</div>
   ${past.length?`<div class="ph" style="margin:18px 2px 8px"><div class="t" style="font-size:13px;color:var(--muted)">지난 일정</div></div><div class="panel" style="opacity:.7">${past.slice(0,10).map(schedRow).join('')}</div>`:''}`;
 }
 if(!calYM)calYM=t.slice(0,7);
 const [y,m]=calYM.split('-').map(Number);
 const first=new Date(y,m-1,1), start=new Date(y,m-1,1-first.getDay());
 const byDate={};DB.schedule.forEach(s=>{
  const a=new Date(s.date+'T00:00'),b=new Date((s.end&&s.end>s.date?s.end:s.date)+'T00:00');
  for(let d0=new Date(a),i=0;d0<=b&&i<62;d0.setDate(d0.getDate()+1),i++){
   const ds=d0.getFullYear()+'-'+String(d0.getMonth()+1).padStart(2,'0')+'-'+String(d0.getDate()).padStart(2,'0');
   (byDate[ds]=byDate[ds]||[]).push(s);
  }});
 let cells='';
 for(let i=0;i<42;i++){
  const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);
  const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const evs=(byDate[ds]||[]).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const other=d.getMonth()!==m-1;
  cells+=`<div class="cald ${other?'other':''} ${ds===t?'today':''} ${ds===calSel?'sel':''} ${d.getDay()===0?'sun':''}" onclick="calPick('${ds}')">
   <span class="dn">${d.getDate()}</span>
   ${evs.slice(0,3).map(e=>{const c=colorFor(e.site);const lbl=((e.time&&e.date===ds)?esc(e.time)+' ':'')+esc(e.site?(siteShort(e.site)+(e.proc?'·'+e.proc:'')):schedTitle(e));return `<div class="calev" style="${e.site?`background:${c};color:#fff;`:''}${ds<t?'opacity:.55;':''}">${lbl}${(e.end&&ds<e.end)?' ▶':''}</div>`;}).join('')}
   ${evs.length>3?`<div class="calmore">+${evs.length-3}</div>`:''}
   <div class="dots">${evs.slice(0,4).map(e=>`<i style="background:${colorFor(e.site)}"></i>`).join('')}</div>
  </div>`;
 }
 const selEvs=calSel?(byDate[calSel]||[]):[];
 return `<div class="calhead">
   <button class="nav" onclick="calMove(-1)">‹</button><span class="cm">${y}년 ${m}월</span><button class="nav" onclick="calMove(1)">›</button>
   <button class="btn gh sm" onclick="calYM='${t.slice(0,7)}';calSel='${t}';render()">오늘</button>
   <div class="vtog"><button onclick="setSchedMode('list')">목록</button><button class="on" onclick="setSchedMode('cal')">달력</button></div>
   <button class="btn sm" onclick="addMeeting(calSel)">＋ 일정 등록</button>
  </div>
  ${(()=>{const ss=[];Object.values(byDate).forEach(evs=>evs.forEach(e=>{if(e.site&&!ss.includes(e.site))ss.push(e.site);}));
    return ss.length?`<div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px;font-size:12.5px;font-weight:700;color:var(--ink2)">${ss.map(n=>`<span style="display:inline-flex;align-items:center;gap:5px"><span style="width:9px;height:9px;border-radius:3px;background:${colorFor(n)}"></span>${esc(n)}</span>`).join('')}</div>`:'';})()}
  <div class="calwk"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
  <div class="cal">${cells}</div>
  ${calSel?`<div class="panel" style="margin-top:14px"><div class="ph"><div class="t">${calSel} 일정 ${selEvs.length}건</div><button class="btn gh sm" onclick="addMeeting('${calSel}')">＋ 이 날짜로 등록</button></div>
   ${selEvs.length?selEvs.map(schedRow).join(''):'<div class="empty">이 날은 일정이 없어요</div>'}</div>`:''}`;
}
let _mtKind='work',_mtProc='';
function mtKind(k){_mtKind=k;document.querySelectorAll('[data-mtk]').forEach(el=>el.classList.toggle('on',el.dataset.mtk===k));const w=$('mt_workbox');if(w)w.style.display=(k==='work')?'block':'none';}
function mtProc(p){_mtProc=(_mtProc===p?'':p);document.querySelectorAll('[data-mtp]').forEach(el=>el.classList.toggle('on',el.dataset.mtp===_mtProc));}
let _mtSite='';
function mtSiteChip(n){
 _mtSite=(_mtSite===n?'':n);
 document.querySelectorAll('[data-mts]').forEach(el=>el.classList.toggle('on',el.dataset.mts===_mtSite));
 $('mt_sitec').style.display=(_mtSite==='__custom')?'block':'none';
 const st=DB.sites.find(x=>x.name===_mtSite);
 if(st){if(st.addr&&!$('mt_addr').value)$('mt_addr').value=st.addr;if(st.phone&&!$('mt_phone').value)$('mt_phone').value=st.phone;}
}
function addMeeting(dt){_mtKind='work';_mtProc='';_mtSite='';openModal(`<h3>일정 등록</h3>
 <div class="f"><label>종류</label><div class="mrow">
  <button class="mchip on" data-mtk="work" onclick="mtKind('work')">현장 공정</button>
  <button class="mchip" data-mtk="meet" onclick="mtKind('meet')">미팅·실측</button>
  <button class="mchip" data-mtk="etc" onclick="mtKind('etc')">기타</button></div></div>
 <div id="mt_workbox">
  <div class="f"><label>현장 (고르면 주소·전화 자동)</label><div class="mrow">${siteNames().slice(0,8).map(n=>`<button class="mchip" data-mts="${esc(n)}" onclick="mtSiteChip('${esc(n).replace(/'/g,"\\'")}')">${esc(siteShort(n)===n?n:n.slice(0,14))}</button>`).join('')}<button class="mchip" data-mts="__custom" onclick="mtSiteChip('__custom')">직접 입력</button></div><input id="mt_sitec" placeholder="현장명 입력" style="display:none;margin-top:8px"></div>
  <div class="f"><label>공정 (한 번 누르면 선택, 다시 누르면 해제)</label><div class="mrow">${PROCS.map(p=>`<button class="mchip" data-mtp="${p}" onclick="mtProc('${p}')">${p}</button>`).join('')}</div></div>
 </div>
 <div class="f"><label>내용 (비우면 "현장 — 공정"으로 자동)</label><input id="mt_title" placeholder="예: 봉천 치킨집 실측 방문"></div>
 <div class="f2"><div class="f"><label>시작일</label><input id="mt_date" type="date" value="${(typeof dt==='string'&&dt)?dt:todayStr()}"></div><div class="f"><label>종료일 (하루짜리면 비움)</label><input id="mt_end" type="date"></div></div>
 <div class="f2"><div class="f"><label>시간 (선택)</label><input id="mt_time" type="time"></div><div class="f"><label>상대/담당 (선택)</label><input id="mt_with" placeholder="이성원 대표"></div></div>
 <div class="f2"><div class="f"><label>주소 (선택) — 누르면 지도</label><input id="mt_addr" placeholder="예: 관악구 봉천동 123-4"></div><div class="f"><label>전화번호 (선택) — 누르면 전화</label><input id="mt_phone" inputmode="tel" placeholder="010-0000-0000"></div></div>
 <div class="f"><label>메모 (선택)</label><input id="mt_memo"></div>
 <div class="mact"><button class="btn gh" onclick="closeModal()">취소</button><button class="btn" onclick="createMeeting()">등록</button></div>`);}
function createMeeting(){
 const site=(_mtKind==='work')?((_mtSite==='__custom')?$('mt_sitec').value.trim():_mtSite):'';
 const proc=(_mtKind==='work')?_mtProc:'';
 const t=$('mt_title').value.trim(),d=$('mt_date').value;
 if(!d){toast('시작일을 선택하세요');return;}
 if(!t&&!site&&!proc){toast('내용을 쓰거나 현장·공정을 선택하세요');return;}
 let end=$('mt_end').value;if(end&&end<=d)end='';
 DB.schedule.push({id:uid(),kind:_mtKind,site,proc,date:d,end,time:$('mt_time').value,title:t,with:$('mt_with').value,memo:$('mt_memo').value,addr:$('mt_addr').value.trim(),phone:$('mt_phone').value.trim()});
 save();closeModal();render();toast('일정 등록됨');}
function delMeeting(id){if(!confirm('이 일정을 삭제할까요?'))return;DB.schedule=DB.schedule.filter(x=>x.id!==id);tomb(id);save();render();toast('삭제됨');}

/* ---------- modal ---------- */
function openModal(html){$('modal').innerHTML=html;$('ov').classList.add('on');}
function closeModal(){$('ov').classList.remove('on');}

/* ---------- init ---------- */
load();loadCloud();loadEst();render();cloudPullMerge();estPull();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){cloudPullMerge();estPull();}});
</script>
